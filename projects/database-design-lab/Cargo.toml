[workspace]
resolver = "2"
members = [
    "crates/db-core",
    "crates/db-storage-memory",
    "crates/db-storage-log",
    "crates/db-storage-btree",
    "crates/db-storage-lsm",
    "crates/db-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Lei-TzuY/database-design-lab"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
