path = "src/bin/db-lab-log-generation-cutover.rs"

[[bin]]
name = "db-lab-log-generation-cutover-verify"
path = "src/bin/db-lab-log-generation-cutover-verify.rs"

[[bin]]
name = "db-lab-log-generation-run"
path = "src/bin/db-lab-log-generation-run.rs"

[[bin]]
name = "db-lab-shrink"
path = "src/bin/db-lab-shrink.rs"

[dependencies]
clap.workspace = true
db-core = { path = "../db-core" }
db-storage-btree = { path = "../db-storage-btree" }
db-storage-lsm = { path = "../db-storage-lsm" }
db-storage-log = { path = "../db-storage-log" }
db-storage-memory = { path = "../db-storage-memory" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"