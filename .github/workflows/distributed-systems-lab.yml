name: Distributed systems migration

on:
  push:
    branches: [main]
    paths:
      - 'projects/distributed-systems-lab/**'
      - 'projects/manifest.json'
      - '.github/workflows/distributed-systems-lab.yml'
  pull_request:
    paths:
      - 'projects/distributed-systems-lab/**'
      - 'projects/manifest.json'
      - '.github/workflows/distributed-systems-lab.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: f1638f9121ee550b688a3f6bf9ab03df369139dc
  SOURCE_TREE: b816d1f0a658a611887b5d4fe17f05a5499e9bd2
  SOURCE_COMMIT_COUNT: "110"
  PROJECT_DIR: projects/distributed-systems-lab

jobs:
  history-tree-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify preserved source ancestry and tree
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$SOURCE_TREE"
          test "$(git rev-parse "HEAD:${PROJECT_DIR}")" = "$SOURCE_TREE"
      - name: Verify preserved source provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          source = os.environ["SOURCE_SHA"]
          raw = subprocess.check_output(
              ["git", "log", source, "--format=%H%x00%B%x00"], text=True
          )
          parts = raw.split("\0")
          commits = []
          for i in range(0, len(parts) - 1, 2):
              sha, body = parts[i].strip(), parts[i + 1]
              if sha:
                  commits.append((sha, body))

          expected_count = int(os.environ["SOURCE_COMMIT_COUNT"])
          if len(commits) != expected_count:
              raise SystemExit(
                  f"source history mismatch: expected {expected_count}, got {len(commits)}"
              )

          markers = (
              "co-authored-by:",
              "generated-by:",
              "assisted-by:",
              "signed-off-by:",
              "claude",
              "anthropic",
              "openai",
          )
          hits = []
          for sha, body in commits:
              for line in body.splitlines():
                  normalized = line.strip().lower()
                  if any(marker in normalized for marker in markers):
                      hits.append((sha, line.strip()))
          if hits:
              raise SystemExit(f"unexpected attribution markers: {hits}")
          print(f"audited {len(commits)} reachable source commits; configured markers=0")
          PY

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/distributed-systems-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/distributed-systems-lab/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
