name: Bootstrap distributed-systems-lab migration

on:
  push:
    branches:
      - migration/distributed-systems-lab
    paths:
      - .github/workflows/bootstrap-distributed-systems.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: Lei-TzuY/distributed-systems-lab
      SOURCE_SHA: f1638f9121ee550b688a3f6bf9ab03df369139dc
      SOURCE_TREE: b816d1f0a658a611887b5d4fe17f05a5499e9bd2
      SOURCE_COMMIT_COUNT: "110"
      TARGET_PATH: projects/distributed-systems-lab
    steps:
      - name: Checkout umbrella history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recheck live source freeze
        shell: bash
        run: |
          set -euo pipefail
          live_sha="$(git ls-remote "https://github.com/${SOURCE_REPO}.git" refs/heads/main | awk '{print $1}')"
          test "$live_sha" = "$SOURCE_SHA"
          python - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/Lei-TzuY/distributed-systems-lab/pulls?state=open&per_page=100"
          req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req) as response:
              pulls = json.load(response)
          if pulls:
              raise SystemExit(f"source gained open PRs: {[pr['number'] for pr in pulls]}")
          print("source main unchanged and open PR count is zero")
          PY

      - name: Fetch exact source history
        shell: bash
        run: |
          set -euo pipefail
          git remote add source "https://github.com/${SOURCE_REPO}.git"
          git fetch --no-tags source main
          test "$(git rev-parse source/main)" = "$SOURCE_SHA"
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$SOURCE_TREE"

      - name: Audit complete source provenance and hygiene
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          source = "source/main"
          raw = subprocess.check_output(
              ["git", "log", source, "--format=%H%x00%B%x00"], text=True
          )
          parts = raw.split("\0")
          commits = []
          for i in range(0, len(parts) - 1, 2):
              sha, body = parts[i].strip(), parts[i + 1]
              if sha:
                  commits.append((sha, body))

          expected_count = int(os.environ["SOURCE_COMMIT_COUNT"])
          if len(commits) != expected_count:
              raise SystemExit(
                  f"source history moved: expected {expected_count} commits, got {len(commits)}"
              )

          markers = (
              "co-authored-by:",
              "generated-by:",
              "assisted-by:",
              "signed-off-by:",
              "claude",
              "anthropic",
              "openai",
          )
          hits = []
          for sha, body in commits:
              for line in body.splitlines():
                  normalized = line.strip().lower()
                  if any(marker in normalized for marker in markers):
                      hits.append((sha, line.strip()))
          if hits:
              raise SystemExit(f"unexpected attribution markers: {hits}")
          print(f"audited {len(commits)} reachable commits; configured attribution markers=0")
          PY

          git ls-tree -r --name-only source/main > /tmp/source-tree.txt
          ! grep -Fxq '.gitmodules' /tmp/source-tree.txt
          ! grep -Eq '(^|/)(target|__pycache__|\.venv|\.pytest_cache)(/|$)' /tmp/source-tree.txt

      - name: Import non-squashed subtree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$TARGET_PATH"
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git subtree add \
            --prefix="$TARGET_PATH" \
            source "$SOURCE_SHA" \
            -m "Import distributed-systems-lab at ${SOURCE_SHA}"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$(git rev-parse "HEAD:${TARGET_PATH}")"

      - name: Push migration branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
